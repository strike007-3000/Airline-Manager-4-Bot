name: Fuel Monitor (30m)
on:
  # Scheduling moved to cron-job.org for better reliability
  workflow_dispatch:
  # schedule:
  # - cron: "*/30 * * * *"
permissions:
  contents: read
jobs:
  monitor:
    environment: production
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Fuel Monitor
      run: npx playwright test tests/fuelMonitor.spec.ts
      env:
        EMAIL: ${{ secrets.EMAIL }}
        PASSWORD: ${{ secrets.PASSWORD }}
        MAX_FUEL_PRICE: ${{ vars.MAX_FUEL_PRICE }}
        MAX_CO2_PRICE: ${{ vars.MAX_CO2_PRICE }}
        GAME_MODE: ${{ vars.GAME_MODE }}
        MINIMUM_FUEL_COVER_HOURS: ${{ vars.MINIMUM_FUEL_COVER_HOURS }}
        MINIMUM_CO2_COVER_HOURS: ${{ vars.MINIMUM_CO2_COVER_HOURS }}
        AVERAGE_FUEL_BURN_PER_DEPARTURE: ${{ vars.AVERAGE_FUEL_BURN_PER_DEPARTURE }}
        AVERAGE_CO2_BURN_PER_DEPARTURE: ${{ vars.AVERAGE_CO2_BURN_PER_DEPARTURE }}
        MARKET_HISTORY_FILE: ${{ vars.MARKET_HISTORY_FILE }}
